# Render Blueprint (free plan): BharatSatya API (Node/Express) + OCR service (Python/Tesseract).
# The PostgreSQL database is hosted separately; paste its URLs when the Blueprint asks.
# Values marked sync: false are entered in the Render dashboard when the Blueprint is applied.

envVarGroups:
  - name: bharatsatya-ocr-shared
    envVars:
      - key: OCR_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: bharatsatya-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DOCUMENT_STORAGE_PROVIDER
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: OBJECT_STORAGE_PRIVATE_BUCKET_CONFIRMED
        sync: false
      - key: OCR_SERVICE_URL
        sync: false
      - key: OCR_SERVICE_TIMEOUT_MS
        value: "90000"
      - fromGroup: bharatsatya-ocr-shared

  - type: web
    name: bharatsatya-ocr
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./ocr.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - fromGroup: bharatsatya-ocr-shared
